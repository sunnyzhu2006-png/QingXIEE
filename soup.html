	<title>湯品相簿</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #f6f3ef; }
		header { padding: 3rem 1.5rem 2rem; text-align: center; background: #fff; }
		h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 5vw, 4rem); }
		header p { margin: 0; color: #666; }
		main { max-width: 1200px; margin: auto; padding: 2rem 1.5rem; }
		.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
		figure { margin: 0; overflow: hidden; border-radius: 12px; background: #ddd; }
		figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; cursor: zoom-in; transition: transform .25s ease; }
		figure:hover img { transform: scale(1.05); }
		.lightbox { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; padding: 2rem; background: rgba(0, 0, 0, .85); }
		.lightbox.is-visible { display: flex; }
		.lightbox-image { max-width: 95vw; max-height: 90vh; object-fit: contain; cursor: zoom-in; transition: transform .25s ease; touch-action: none; user-select: none; }
		.lightbox-image.is-zoomed { transform: translate(var(--zoom-x), var(--zoom-y)) scale(1.7); cursor: grab; }
		.lightbox-image.is-dragging { cursor: grabbing; transition: none; }
		.lightbox-close { position: absolute; top: 1rem; right: 1.5rem; border: 0; background: transparent; color: #fff; font-size: 2.5rem; cursor: pointer; }
		.lightbox-download { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); padding: .65rem 1rem; border-radius: 6px; background: #fff; color: #222; text-decoration: none; font-weight: 600; }
		.lightbox-open { overflow: hidden; }
		figcaption { padding: .75rem; background: #fff; font-weight: 600; }
	</style>

</head>
